name: Generate API documentation

# Boots the application against a throwaway PostgreSQL, exports the OpenAPI
# specification produced by springdoc, and commits it back to docs/openapi.yaml.
# GitHub Pages serves docs/ from the default branch, so the published site
# refreshes on its own once the commit lands.

on:
  push:
    branches: [master]
    paths:
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'build.gradle'
      - '.github/workflows/api-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-docs
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: presence
          POSTGRES_USER: presence
          POSTGRES_PASSWORD: presence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U presence -d presence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Start the application
        env:
          DB_URL: jdbc:postgresql://localhost:5432/presence
          DB_USER: presence
          DB_PASSWORD: presence
        run: |
          ./gradlew bootRun --console=plain > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for the OpenAPI endpoint
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/v3/api-docs.yaml -o /tmp/openapi.yaml; then
              echo "Specification retrieved after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::The application did not expose /v3/api-docs.yaml in time."
          tail -100 app.log
          exit 1

      - name: Stop the application
        if: always()
        run: kill "$(cat app.pid)" || true

      - name: Update docs/openapi.yaml
        run: |
          {
            echo "# Generated by .github/workflows/api-docs.yml from the springdoc"
            echo "# endpoint /v3/api-docs.yaml. Do not edit by hand — change the"
            echo "# annotations in src/main/java/**/infrastructure/web/ instead."
            cat /tmp/openapi.yaml
          } > docs/openapi.yaml

      - name: Commit if the specification changed
        run: |
          if git diff --quiet -- docs/openapi.yaml; then
            echo "Specification unchanged, nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.yaml
          git commit -m "Regenerate API specification [skip ci]"
          git push
